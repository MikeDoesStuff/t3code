name: Sign existing APK for installer compatibility

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful nightly APK build run"
        required: true
        default: "37487163783"
        type: string
      release_tag:
        description: "Existing fork release to upload the compatibility APK to"
        required: true
        default: "v0.0.46-nightly.20261005.2702"
        type: string

permissions:
  contents: write
  actions: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download existing APK
        env:
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || exit 1
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n t3code-preview-nightly -D apk
          test -f apk/app-release.apk

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Add compatible signatures with the same template debug signer
        run: |
          # This is Expo's public development keystore, not personal/store credentials.
          template="$(npm pack expo-template-bare-minimum@58.0.14 --silent --pack-destination "$RUNNER_TEMP")"
          tar -xf "$RUNNER_TEMP/$template" -C "$RUNNER_TEMP" package/android/app/debug.keystore
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs apk/app-release.apk > "$RUNNER_TEMP/original-cert.txt"
          mkdir -p signed
          "$tools/zipalign" -P 16 -f 4 apk/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/package/android/app/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "signed/T3-Code-Preview-$RELEASE_TAG-compatible.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "signed/T3-Code-Preview-$RELEASE_TAG-compatible.apk" | tee "$RUNNER_TEMP/compatible-cert.txt"
          diff <(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/original-cert.txt") <(grep 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/compatible-cert.txt")
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/compatible-cert.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/compatible-cert.txt"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/compatible-cert.txt"
          "$tools/zipalign" -c -P 16 4 "signed/T3-Code-Preview-$RELEASE_TAG-compatible.apk"
          sha256sum "signed/T3-Code-Preview-$RELEASE_TAG-compatible.apk"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: t3code-preview-compatible
          path: signed/*.apk
          if-no-files-found: error

      - name: Publish compatibility APK on existing release
        run: gh release upload "$RELEASE_TAG" "signed/T3-Code-Preview-$RELEASE_TAG-compatible.apk" -R "$GITHUB_REPOSITORY"

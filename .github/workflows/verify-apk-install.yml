name: Verify Android APK installation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful nightly APK build run to verify"
        required: true
        default: "37487163783"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download APK build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n t3code-preview-nightly -D apk
          test -f apk/app-release.apk

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android emulator
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: android-37-x86_64-apk-install-4gb-v2

      - name: Verify signature and install on Android 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)" verify --verbose --print-certs apk/app-release.apk
            adb shell df -h /data
            adb install --no-streaming apk/app-release.apk
            adb shell pm path com.t3tools.t3code.preview

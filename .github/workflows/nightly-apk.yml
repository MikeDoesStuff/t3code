name: Nightly Android APK

# Builds upstream nightly source in the personal EAS project.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag/branch to build (blank = latest nightly tag)"
        required: false
        type: string
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-apk-eas
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 180
    env:
      APP_VARIANT: preview
      MOBILE_VERSION_POLICY: appVersion
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check Expo authentication is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::Set EXPO_TOKEN in the production environment"; exit 1; }

      - name: Resolve build ref
        id: resolve
        run: |
          if [ -n "${REF:-}" ]; then
            ref="$REF"
          else
            ref="$(git ls-remote --tags --refs https://github.com/pingdotgg/t3code.git 'v*nightly*' | awk -F/ '{print $3}' | sort -V | tail -n1)"
          fi
          [ -n "$ref" ] || { echo "::error::Could not resolve a build ref"; exit 1; }
          echo "Building from ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        env:
          REF: ${{ inputs.ref }}

      - name: Checkout personal build setup
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Preserve personal build setup
        run: cp .github/scripts/prepare-eas-nightly.mjs "$RUNNER_TEMP/prepare-eas-nightly.mjs"

      - name: Checkout upstream
        uses: actions/checkout@v6
        with:
          repository: pingdotgg/t3code
          ref: ${{ steps.resolve.outputs.ref }}
          # EAS archives with a local git clone; partial clones can fail on missing blobs.
          fetch-depth: 1

      - name: Setup Vite+ and cache mobile dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose matching pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Configure personal EAS nightly APK
        run: node "$RUNNER_TEMP/prepare-eas-nightly.mjs"

      - name: Verify resolved standalone app identity
        working-directory: apps/mobile
        run: |
          npx expo config --json | node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (c.android?.package !== "com.t3tools.t3code.preview" ||
                c.owner !== "miccul" ||
                c.extra?.eas?.projectId !== "7692959f-2dcf-43b1-9acd-33771a371a21" ||
                c.updates?.enabled !== false) {
              throw new Error("Resolved Expo config does not match the standalone nightly app");
            }
            console.log("Preview package, personal EAS project and disabled OTA verified");
          '

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build standalone APK in EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_REF: ${{ steps.resolve.outputs.ref }}
        run: |
          eas build --platform android --profile nightly --non-interactive --wait --json --message "$BUILD_REF" > "$RUNNER_TEMP/eas-build.json"

      - name: Download completed APK
        run: |
          url="$(jq -er '.[0].artifacts.buildUrl' "$RUNNER_TEMP/eas-build.json")"
          build_id="$(jq -er '.[0].id' "$RUNNER_TEMP/eas-build.json")"
          mkdir -p dist-apk
          curl --fail --location --retry 3 "$url" --output dist-apk/t3code-preview-nightly.apk
          unzip -t dist-apk/t3code-preview-nightly.apk > /dev/null
          echo "### Nightly APK" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS build: https://expo.dev/accounts/miccul/projects/t3code-nightly/builds/$build_id" >> "$GITHUB_STEP_SUMMARY"
          sha256sum dist-apk/t3code-preview-nightly.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: t3code-preview-nightly
          path: dist-apk/t3code-preview-nightly.apk
          if-no-files-found: error

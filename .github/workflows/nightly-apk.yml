name: Nightly Android APK

# Builds T3 Code Mobile ("T3 Code Preview", package com.t3tools.t3code.preview)
# into a self-contained, sideloadable APK — entirely in the cloud, no Android
# SDK/Studio needed locally. Installs side-by-side with the Play Store app.
#
# The workflow lives on the fork but checks out pingdotgg/t3code directly, so it
# always builds upstream's code (default: the latest nightly tag).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag/branch to build (blank = latest nightly tag)"
        required: false
        type: string
  schedule:
    - cron: "15 4 * * *" # nightly 04:15 UTC

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_VARIANT: preview
      MOBILE_VERSION_POLICY: appVersion
      # Keep the installed app on the nightly source that this job builds.
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Resolve build ref
        id: resolve
        shell: bash
        run: |
          if [ -n "${REF:-}" ]; then
            ref="$REF"
          else
            ref="$(git ls-remote --tags --refs https://github.com/pingdotgg/t3code.git 'v*nightly*' | awk -F/ '{print $3}' | sort -V | tail -n1)"
          fi
          [ -n "$ref" ] || { echo "::error::could not resolve a build ref" >&2; exit 1; }
          echo "Building from ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        env:
          REF: ${{ inputs.ref }}

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ${{ steps.resolve.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # T3 Connect (Clerk + relay) is disabled in a fresh clone; the committed
      # public config enables it against the production deployment.
      - name: Enable T3 Connect (production public config)
        run: cp .env.example .env

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default (`tools platform-tools`) fails: the legacy
          # `tools` package no longer exists in Google's SDK repository.
          # Install platform-tools only; Gradle fetches the exact platform,
          # build-tools and NDK the generated project requires.
          packages: platform-tools build-tools;36.0.0

      - name: Prebuild Android (preview variant)
        working-directory: apps/mobile
        env:
          # The copied .env leaves the repo "dirty"; prebuild's git-clean
          # check would block in non-interactive CI (same reason their own
          # scripts set EXPO_NO_GIT_STATUS=1).
          EXPO_NO_GIT_STATUS: 1
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Ensure release signs with debug keystore
        working-directory: apps/mobile/android
        run: |
          # Explicitly include JAR certificates for installer/parser compatibility.
          # Keep Gradle's final settings deterministic without matching comments.
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: apps/mobile/android
        # Pass CI settings as options: generated gradle.properties may have no
        # trailing newline, so appending settings can corrupt its final value.
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace --build-cache
          --parallel --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'

      - name: Locate APK
        id: apk
        working-directory: apps/mobile/android
        run: |
          apk="$(find app/build/outputs/apk -name '*.apk' | head -n1)"
          [ -n "$apk" ] || { echo "::error::No APK was produced"; exit 1; }
          echo "path=apps/mobile/android/$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Verify APK signing and alignment
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$APK_PATH" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/apk-signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/apk-signature.txt"
          "$tools/zipalign" -c -P 16 4 "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: t3code-preview-nightly
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
